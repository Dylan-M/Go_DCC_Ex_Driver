name: Application and UI tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application and UI tests (${{ github.event_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Unit and Fyne UI tests with race detection
        run: go test -race -tags ci -count=1 -timeout=3m ./...
      - name: Static checks
        run: go vet -tags ci,firmware ./...
      - name: Headless startup cleanup regression
        run: go test -race -tags ci -run '^TestHeadlessApplicationStartupUsesTabDatabase$' -count=20 -timeout=2m ./cmd/dccex-driver
      - name: Storage cross-compilation (not mobile runtime tests)
        shell: bash
        run: |
          set -euo pipefail
          for target in windows/amd64 darwin/arm64 linux/amd64 android/arm64 ios/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./stations ./startup
          done
