name: Real firmware integration
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install locked emulator dependency
        working-directory: integration/emulator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify firmware loader
        working-directory: integration/emulator
        run: npm test
      - name: Install verified Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          cd "$RUNNER_TEMP/arduino-cli"
          curl --fail --location --retry 3 -o cli.tar.gz https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  cli.tar.gz' | sha256sum --check
          tar -xzf cli.tar.gz
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"
      - name: Build pinned production firmware
        run: node integration/emulator/build.cjs
      - name: Core and firmware tests (race detector enabled)
        env:
          DCCEX_LOG_DIR: ${{ github.workspace }}/integration/emulator/.work/logs
        run: go test -race -tags firmware -count=1 -timeout=3m ./dccex/... ./throttle ./config ./integration
      - name: Static checks
        run: go vet -tags firmware ./dccex/... ./throttle ./config ./integration
      - name: Fyne UI tests (headless test driver)
        run: go test -tags ci -count=1 -timeout=2m ./ui/fyne
      - name: Retain diagnostics (not firmware binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-diagnostics
          include-hidden-files: true
          path: |
            integration/emulator/.work/logs/*.jsonl
            integration/emulator/.work/build/provenance.json
          if-no-files-found: ignore
          retention-days: 7
