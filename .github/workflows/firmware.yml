name: Real firmware integration
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Install locked emulator dependency
        working-directory: integration/emulator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify firmware loader
        working-directory: integration/emulator
        run: npm test
      - name: Install verified Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          cd "$RUNNER_TEMP/arduino-cli"
          curl --fail --location --retry 3 -o cli.tar.gz https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  cli.tar.gz' | sha256sum --check
          tar -xzf cli.tar.gz
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"
      - name: Build pinned production firmware
        run: node integration/emulator/build.cjs
      - name: Core and firmware tests (race detector enabled)
        env:
          DCCEX_LOG_DIR: ${{ github.workspace }}/integration/emulator/.work/logs
        run: go test -race -tags firmware -count=1 -timeout=3m ./dccex/... ./throttle ./config ./stations ./startup ./integration
      - name: Static checks
        run: go vet -tags ci,firmware ./...
      - name: Fyne UI tests (headless test driver)
        run: go test -tags ci -count=1 -timeout=2m ./ui/fyne ./cmd/dccex-driver
      - name: Storage cross-compilation (not mobile runtime tests)
        shell: bash
        run: |
          set -euo pipefail
          for target in windows/amd64 darwin/arm64 linux/amd64 android/arm64 ios/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./stations ./startup
          done
      - name: Retain diagnostics (not firmware binaries)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-diagnostics
          include-hidden-files: true
          path: |
            integration/emulator/.work/logs/*.jsonl
            integration/emulator/.work/build/provenance.json
          if-no-files-found: ignore
          retention-days: 7
