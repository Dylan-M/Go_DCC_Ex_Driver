name: Platform builds and releases

on:
  push:
    tags: ['v*']
  # Select builds inside the workflow so the merge gate always reports.
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build-only rehearsal (never publishes a release)'
        default: 'v0.0.0-ci.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select platform builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Test build selection and merge gate
        run: node --test .github/scripts/release-policy.test.cjs
      - name: Apply release path filters
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/release-changes"
            node -e '
              const fs = require("node:fs");
              const { requiresReleaseBuild } = require("./.github/scripts/release-policy.cjs");
              const paths = fs.readFileSync(process.argv[1], "utf8").split("\0").filter(Boolean);
              console.log("required=" + requiresReleaseBuild(paths));
            ' "$RUNNER_TEMP/release-changes" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Release version and test validation
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      android_alpha: ${{ steps.version.outputs.android_alpha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version || 'v0.0.0-ci.1' }}
        run: |
          set -euo pipefail
          go run ./internal/release validate "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Unit and headless UI tests
        run: go test -race -tags ci -timeout=3m ./...
      - name: Static checks
        run: go vet -tags ci ./...

  windows_amd64:
    name: Windows x64 package
    needs: validate
    uses: ./.github/workflows/desktop-package.yml
    with:
      runner: windows-2022
      target: windows-amd64
      goos: windows
      goarch: amd64
      llvm: x86_64
      sha: 1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6
      tag: ${{ needs.validate.outputs.tag }}

  windows_arm64:
    name: Windows ARM64 package
    needs: validate
    uses: ./.github/workflows/desktop-package.yml
    with:
      runner: windows-11-arm
      target: windows-arm64
      goos: windows
      goarch: arm64
      llvm: aarch64
      sha: 7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56
      tag: ${{ needs.validate.outputs.tag }}

  macos_amd64:
    name: macOS Intel package
    needs: validate
    uses: ./.github/workflows/desktop-package.yml
    with:
      runner: macos-15-intel
      target: macos-amd64
      goos: darwin
      goarch: amd64
      tag: ${{ needs.validate.outputs.tag }}

  macos_arm64:
    name: macOS Apple Silicon package
    needs: validate
    uses: ./.github/workflows/desktop-package.yml
    with:
      runner: macos-15
      target: macos-arm64
      goos: darwin
      goarch: arm64
      tag: ${{ needs.validate.outputs.tag }}

  linux_amd64:
    name: Linux x64 package
    needs: validate
    uses: ./.github/workflows/desktop-package.yml
    with:
      runner: ubuntu-24.04
      target: linux-amd64
      goos: linux
      goarch: amd64
      tag: ${{ needs.validate.outputs.tag }}

  linux_arm64:
    name: Linux ARM64 package
    needs: validate
    uses: ./.github/workflows/desktop-package.yml
    with:
      runner: ubuntu-24.04-arm
      target: linux-arm64
      goos: linux
      goarch: arm64
      tag: ${{ needs.validate.outputs.tag }}

  android:
    needs: validate
    # Debug APKs belong only to alpha releases. PR/manual runs rehearse the build.
    if: github.event_name != 'push' || needs.validate.outputs.android_alpha == 'true'
    name: Android ARM64 release package (debug-signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-tools/sdk
      ANDROID_TOOLS_BIN: ${{ github.workspace }}/.android-tools/bin
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore pinned Android and Fyne tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-tools
          key: android-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/android-versions.env', 'go.mod', 'scripts/setup-android.sh') }}
      - name: Verify and install missing tools
        run: bash scripts/setup-android.sh
      - name: Build and verify versioned APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-android.sh arm64 "$RELEASE_TAG"
          mkdir -p staging/android
          cp dist/android/dccex-arm64.apk "staging/android/Go_DCC_Ex_Driver-$RELEASE_TAG-android-arm64-debug.apk"
      - name: Retain Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-arm64
          path: staging/android/*.apk
          if-no-files-found: error
          retention-days: 7

  release_checks:
    name: Platform build results (${{ github.event_name }})
    if: always() && github.event_name == 'pull_request'
    needs: [changes, validate, windows_amd64, windows_arm64, macos_amd64, macos_arm64, linux_amd64, linux_arm64, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Require every selected build to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, require("./.github/scripts/release-policy.cjs").reportReleaseResults(JSON.parse(process.env.CI_NEEDS)))'

  publish:
    name: Publish tagged GitHub release
    # Allow the intentional Android skip for non-alpha tags, but never a failed build.
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.validate.result == 'success' &&
      needs.windows_amd64.result == 'success' &&
      needs.windows_arm64.result == 'success' &&
      needs.macos_amd64.result == 'success' &&
      needs.macos_arm64.result == 'success' &&
      needs.linux_amd64.result == 'success' &&
      needs.linux_arm64.result == 'success' &&
      (needs.android.result == 'success' ||
       (needs.validate.outputs.android_alpha != 'true' && needs.android.result == 'skipped'))
    needs: [validate, windows_amd64, windows_arm64, macos_amd64, macos_arm64, linux_amd64, linux_arm64, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          ANDROID_ALPHA: ${{ needs.validate.outputs.android_alpha }}
        run: |
          set -euo pipefail
          go run ./internal/release checksums "$RELEASE_TAG" dist
          (cd dist && sha256sum --check SHA256SUMS)
          # Start as a draft so a partial upload is never publicly presented as complete.
          # Reruns may finish an existing draft, but cannot overwrite published assets.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true
          else
            options=()
            if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); fi
            if [[ "$ANDROID_ALPHA" == true ]]; then
              options+=(--notes 'The Android ARM64 APK is debug-signed for alpha testing only. It is not publisher-authenticated or suitable for production. Proper release signing is planned before beta.')
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --generate-notes "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
