name: Releases

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'internal/release/**'
      - 'scripts/*android*'
      - 'cmd/dccex-driver/AndroidManifest.xml.in'
      - 'internal/androidicon/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build-only rehearsal (never publishes a release)'
        default: 'v0.0.0-ci.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      android_alpha: ${{ steps.version.outputs.android_alpha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version || 'v0.0.0-ci.1' }}
        run: |
          set -euo pipefail
          go run ./internal/release validate "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Unit and headless UI tests
        run: go test -race -tags ci -timeout=3m ./...
      - name: Static checks
        run: go vet -tags ci ./...

  build:
    needs: validate
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-amd64, goos: windows, goarch: amd64, llvm: x86_64, sha: 1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6}
          - {runner: windows-11-arm, target: windows-arm64, goos: windows, goarch: arm64, llvm: aarch64, sha: 7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56}
          - {runner: macos-15-intel, target: macos-amd64, goos: darwin, goarch: amd64}
          - {runner: macos-15, target: macos-arm64, goos: darwin, goarch: arm64}
          - {runner: ubuntu-24.04, target: linux-amd64, goos: linux, goarch: amd64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64, goos: linux, goarch: arm64}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.goarch }}
      - name: Cache Linux dependency downloads
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: graphics-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/release.yml') }}
      - name: Install Linux graphics development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          # GLFW enables both X11 and Wayland by default on Linux.
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true install -y \
            gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"
      - name: Cache pinned Windows compiler download
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm-mingw-20260908-ucrt-${{ matrix.llvm }}.zip
          key: llvm-mingw-${{ runner.os }}-${{ matrix.llvm }}-${{ matrix.sha }}
      - name: Install verified native Windows compiler
        # Cache only the verified archive; extract fresh on every run.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_HOST: ${{ matrix.llvm }}
          LLVM_SHA256: ${{ matrix.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "llvm-mingw-20260908-ucrt-$env:LLVM_HOST"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$name.zip" -OutFile "$archive.part"
            Move-Item -LiteralPath "$archive.part" -Destination $archive
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:LLVM_SHA256) {
            throw 'LLVM-MinGW checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "$name/bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=$bin/$env:LLVM_HOST-w64-mingw32-clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=$bin/$env:LLVM_HOST-w64-mingw32-clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test on target architecture
        run: go test -tags ci -timeout=3m ./...
      - name: Build native release executable
        run: |
          set -euo pipefail
          mkdir -p staging
          binary=staging/dccex-driver
          flags='-s -w'
          if [[ "$GOOS" == windows ]]; then
            binary+=.exe
            flags+=' -H=windowsgui -extldflags=-static'
          fi
          go build -trimpath -tags release -ldflags "$flags" -o "$binary" ./cmd/dccex-driver
          "$binary" --help
          if [[ "$GOOS" == darwin ]]; then
            codesign --force --sign - "$binary"
            codesign --verify "$binary"
          fi
          go run ./internal/release package "$RELEASE_TAG" "$RELEASE_TARGET" "$binary" dist
      - name: Retain release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: validate
    # Debug APKs belong only to alpha releases. PR/manual runs rehearse the build.
    if: github.event_name != 'push' || needs.validate.outputs.android_alpha == 'true'
    name: Build Android ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-tools/sdk
      ANDROID_TOOLS_BIN: ${{ github.workspace }}/.android-tools/bin
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore pinned Android and Fyne tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-tools
          key: android-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/android-versions.env', 'go.mod', 'scripts/setup-android.sh') }}
      - name: Verify and install missing tools
        run: bash scripts/setup-android.sh
      - name: Build and verify versioned APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-android.sh arm64 "$RELEASE_TAG"
          mkdir -p staging/android
          cp dist/android/dccex-arm64.apk "staging/android/Go_DCC_Ex_Driver-$RELEASE_TAG-android-arm64-debug.apk"
      - name: Retain Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-arm64
          path: staging/android/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    # Allow the intentional Android skip for non-alpha tags, but never a failed build.
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.validate.result == 'success' && needs.build.result == 'success' &&
      (needs.android.result == 'success' ||
       (needs.validate.outputs.android_alpha != 'true' && needs.android.result == 'skipped'))
    needs: [validate, build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          ANDROID_ALPHA: ${{ needs.validate.outputs.android_alpha }}
        run: |
          set -euo pipefail
          go run ./internal/release checksums "$RELEASE_TAG" dist
          (cd dist && sha256sum --check SHA256SUMS)
          # Start as a draft so a partial upload is never publicly presented as complete.
          # Reruns may finish an existing draft, but cannot overwrite published assets.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true
          else
            options=()
            if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); fi
            if [[ "$ANDROID_ALPHA" == true ]]; then
              options+=(--notes 'The Android ARM64 APK is debug-signed for alpha testing only. It is not publisher-authenticated or suitable for production. Proper release signing is planned before beta.')
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --generate-notes "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
