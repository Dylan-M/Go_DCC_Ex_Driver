name: Android phone and emulator builds
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android phone and emulator builds (${{ github.event_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-tools/sdk
      ANDROID_TOOLS_BIN: ${{ github.workspace }}/.android-tools/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore pinned Android and Fyne tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-tools
          key: android-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/android-versions.env', 'go.mod', 'scripts/setup-android.sh') }}
      - name: Verify and install missing tools
        run: bash scripts/setup-android.sh
      - name: Build phone APK
        run: bash scripts/build-android.sh arm64
      - name: Build emulator APK
        run: bash scripts/build-android.sh amd64
      - name: Retain test APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-apks
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7
